# Netlify config for DNS Pulse & Dig (static site, no build step, no functions).
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."          # index.html lives in the repo root
  # No `command`: there is nothing to build. Tailwind is loaded from its CDN.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # Report-Only on purpose: the Tailwind Play CDN injects styles at runtime and may
    # need looser rules than you expect. Load the site, open DevTools > Console, and if
    # there are no CSP warnings, rename this key to "Content-Security-Policy" to enforce it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; connect-src https://dns.google https://cloudflare-dns.com; img-src 'self' data:; base-uri 'none'; form-action 'self'"
